# Fork-only: build this fork and push it to GHCR.
#
# Upstream's cd.yml cannot be reused here — it runs on a self-hosted Blacksmith runner and
# its non-tag path would emit an invalid image tag for a branch name containing a slash.
# This lives in its own file so rebases onto upstream never conflict with it.
name: Build fork image

on:
  push:
    branches:
      - feat/session-ip
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Target platforms. arm64 is emulated via QEMU and is far slower.'
        required: false
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Never run if this branch is ever pushed to the upstream repository.
    if: github.repository != 'umami-software/umami'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # metadata-action sanitises the branch name, so feat/session-ip becomes
          # feat-session-ip rather than an invalid tag.
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keeps GHCR from showing phantom "unknown/unknown" architecture entries.
          provenance: false

      - name: Summary
        run: |
          {
            echo '### Pushed'
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
